upstream clinicalcompass_api {
    server api:8000;
}

upstream pe_api {
    server pe-api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # PE backend. The trailing slash on proxy_pass strips the /pe/ prefix, so the
    # app sees "/health" etc.; root_path=/pe inside the app keeps its docs and
    # OpenAPI URLs pointing back at /pe. A longest-prefix match means this block
    # wins over "location /" for any /pe/... request.
    location = /pe { return 301 /pe/; }
    location /pe/ {
        proxy_pass http://pe_api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # FastAPI builds doc/OpenAPI URLs from this prefix.
        proxy_set_header X-Forwarded-Prefix /pe;
    }

    location / {
        proxy_pass http://clinicalcompass_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
