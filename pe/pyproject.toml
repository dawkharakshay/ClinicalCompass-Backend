[project]
name = "pe"
version = "0.1.0"
description = "PE backend — standalone FastAPI service served behind nginx at /pe/."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.0",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.4",
    "pydantic[email]>=2.13.4",
    "pyjwt[crypto]>=2.10.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.30",
    "sqladmin>=0.27.0",
    "sqlalchemy>=2.0.50",
    "uvicorn[standard]>=0.48.0",
    "wtforms==3.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
