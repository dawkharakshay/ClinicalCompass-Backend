[project]
name = "clinicalcompass"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.136.3",
    "fastapi-storages>=0.5.0",
    "itsdangerous>=2.2.0",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.3.4",
    "pydantic[email]>=2.13.4",
    "pyjwt[crypto]>=2.10.0",
    "python-multipart>=0.0.30",
    "sqladmin>=0.27.0",
    "sqlalchemy>=2.0.50",
    "uvicorn[standard]>=0.48.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "playwright>=1.60.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
